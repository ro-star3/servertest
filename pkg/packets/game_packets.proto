syntax = "proto3";

package packets;

option go_package = "chaogarden-server/pkg/packets";

message Packet {
  uint64 sender_id = 1;
  oneof msg {
    // --- Connection & Auth ---
    IdMessage id = 3;
    LoginRequest login_request = 4;
    RegisterRequest register_request = 5;
    DenyResponse deny_response = 7;
    SaveDataRequest save_data_request = 25;
    Player player_data = 22; // Sent on login with full player save data. CORRECTED.
    PlayerDataUpdate player_data_update = 29;

    // --- World Interaction (NEW) ---
    EnterWorldRequest enter_world_request = 50; // C->S: "I'm ready to enter the game world"
    MapData map_data = 51; // S->C: Here is all the data for the map you are on
    PlayerMoveRequest player_move_request = 52; // C->S: "I want to move to this tile"
    PlayerPositionUpdate player_position_update = 53; // S->C: A player (maybe you) has moved
    PlayerEnterMap player_enter_map = 54; // S->C: A new player has appeared on your map
    PlayerLeaveMap player_leave_map = 55; // S->C: A player has left your map

    // --- Social & Admin ---
    ChatMessage chat = 20;
    FriendRequestList friend_request_list = 30;
    FriendRequestSend friend_request_send = 31;
    FriendRequestResponse friend_request_response = 32;
    FriendRemove friend_remove = 33;
    FriendListUpdate friend_list_update = 34;
    TradeRequestSend trade_request_send = 40;
    TradeRequestReceive trade_request_receive = 41;
    TradeRequestResponse trade_request_response = 42;
    TradeUpdate trade_update = 43;
    TradeAccept trade_accept = 44;
    TradeCancel trade_cancel = 45;
    TradeStart trade_start = 46;
    AdminBanRequest admin_ban_request = 26;
    AdminActionResponse admin_action_response = 27;
    AdminGiveItemRequest admin_give_item_request = 28;

    // --- DEPRECATED (can be removed) ---
    // PlayerMessage player_message = 8;
    // PlayerDirectionMessage player_direction = 9;
    // SporeMessage spore = 10;
    // SporeConsumedMessage spore_consumed = 11;
    // PlayerConsumedMessage player_consumed = 13;
    // MinigameState minigame_state = 21;
    // EnterMinigameRequest enter_minigame_request = 23; // Replaced by EnterWorldRequest
    // LeaveMinigameRequest leave_minigame_request = 24;
    // HiscoresRequest hiscores_request = 35;
    // RequestMinigameState request_minigame_state = 47;
  }
}

// ===================================================================
// World Interaction Packets
// ===================================================================

// C->S: Client sends this after login to say they are ready to spawn in-world.
message EnterWorldRequest {}

// S->C: Sent once when the player enters a map. Contains all initial state.
message MapData {
  string map_id = 1;
  repeated OtherPlayer players = 2;
  // We can add `repeated Npc npcs = 3;` here later.
}

// C->S: Client requests to move to a new tile.
message PlayerMoveRequest {
  int32 target_x = 1;
  int32 target_y = 2;
  int32 direction = 3; // 0=Down, 1=Up, 2=Left, 3=Right
}

// S->C: Server confirms a move and broadcasts it to clients on the map.
message PlayerPositionUpdate {
  uint64 player_id = 1; // The ID of the player who moved.
  int32 new_x = 2;
  int32 new_y = 3;
  int32 direction = 4;
}

// S->C: Broadcast to players on a map when a new player enters.
message PlayerEnterMap {
  OtherPlayer player = 1;
}

// S->C: Broadcast to players on a map when a player leaves.
message PlayerLeaveMap {
  uint64 player_id = 1;
}

// A simplified player object for representing other players in the world.
message OtherPlayer {
  uint64 player_id = 1;
  string username = 2;
  int32 x = 3;
  int32 y = 4;
  int32 direction = 5;
  string sprite_id = 6; // e.g. "player_red_boy"
}


// ===================================================================
// Connection & Auth & Social (Mostly Unchanged)
// ===================================================================

message IdMessage { uint64 id = 1; }
message LoginRequest { string username = 1; string password = 2; }
message RegisterRequest { string username = 1; string password = 2; int32 color = 3; }
message DenyResponse { string reason = 1; }
message SaveDataRequest { string json_data = 1; }

// Sent on successful login, contains the entire player save data blob.
message Player {
  uint64 id = 1;
  string name = 2;
  string baomain_json_data = 3;
}
message PlayerDataUpdate { string baomain_json_data = 1; }

// --- Chat ---
message ChatMessage { string msg = 1; }

// --- Friends ---
message FriendRequestList {}
message FriendRequestSend { string target_username = 1; }
message FriendRequestResponse { string target_username = 1; bool accept = 2; }
message FriendRemove { string target_username = 1; }
message FriendListUpdate {
    message Friend {
        string username = 1;
        bool is_online = 2;
        string status = 3; // 'pending_sent', 'pending_received', 'accepted'
    }
    repeated Friend friends = 1;
}

// --- Trading ---
message TradeRequestSend { string target_username = 1; }
message TradeRequestReceive { string from_username = 1; }
message TradeRequestResponse { string target_username = 1; bool accept = 2; }
message TradeUpdate {
    bool is_locked_in = 1;
    int64 rings = 2;
    message TradeItem { string item_id = 1; int32 amount = 2; }
    message TradeChao { int64 chao_id = 1; string chao_name = 2; string rarity = 3; string scene_path = 4; }
    repeated TradeItem items = 3;
    repeated TradeChao chao = 4;
}
message TradeAccept { bool is_locked_in = 1; }
message TradeCancel { string reason = 1; }
message TradeStart { string other_username = 1; }

// --- Admin ---
message AdminGiveItemRequest { string target_username = 1; string item_id = 2; int32 amount = 3; }
message AdminBanRequest { string target_username = 1; string reason = 2; int64 duration_seconds = 3; }
message AdminActionResponse { bool success = 1; string response_text = 2; }